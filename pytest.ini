[pytest]
# Configuration pytest

# Répertoire de tests
testpaths = tests

# Motifs de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options d'affichage
addopts = -v --strict-markers --tb=short

# Marqueurs personnalisés
markers =
    slow: marque les tests comme lents
    integration: marque les tests d'intégration
    unit: marque les tests unitaires

# Timeout par défaut (en secondes)
timeout = 10

# Coverage
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
